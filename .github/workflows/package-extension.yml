name: Package Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run package:stage
      - name: 生成扩展 ZIP
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          cd dist
          zip -qr "longchat-perf-v${VERSION}.zip" "longchat-perf-v${VERSION}"
          sha256sum "longchat-perf-v${VERSION}.zip" > "longchat-perf-v${VERSION}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: longchat-perf-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: 发布标签时创建/更新 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LongChat Perf ${TAG}" --generate-notes
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
      - name: Release 发布事件补传资产
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/*.sha256 --clobber
